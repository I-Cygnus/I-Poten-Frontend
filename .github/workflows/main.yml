name: Docker Build and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [ self-hosted, i-poten-front ]
    steps:
      - name: Free disk space
        run: |
          docker system prune -af --volumes || true
          docker buildx rm mybuilder || true
          sudo rm -rf /var/lib/buildkit || true

      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create .env files
        run: |
          # 메인 컨테이너 환경변수
          echo "${{ secrets.MAIN_CONTAINER_ENV }}" > main-container/.env
          
          # 계정 앱 환경변수
          echo "${{ secrets.ACCOUNT_ENV }}" > vue-account-app/.env
          
          # 면접 앱 환경변수
          echo "${{ secrets.INTERVIEW_ENV }}" > vue-ai-interview-app/.env
          
          # 마이페이지 앱 환경변수
          echo "${{ secrets.MY_PAGE_ENV }}" > mypage-app/.env
          
          # 퀴즈 및 단어사전 앱 환경변수
          echo "${{ secrets.POTEN_WORD_ENV }}" > poten-word-app/.env
          
          # navigation-bar 앱 환경변수
          echo "${{ secrets.NAVIGATION_BAR_ENV }}" > navigation-bar-app/.env
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --debug
          driver: docker-container
          install: true
          name: mybuilder
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: i-cygnus
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Build and push Docker image (Native ARM64)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/i-cygnus/i-poten-frontend:latest
          platforms: linux/arm64
          build-args: |
            REACT_POTEN_WORD_APP=https://i-poten.com/poten-word-app
            REACT_NAVIGATION_APP=https://i-poten.com/navigation-bar-app
            REACT_MYPAGE_APP=https://i-poten.com/mypage-app
            VUE_ACCOUNT_APP=https://i-poten.com/vue-account-app
            VUE_AI_INTERVIEW_APP=https://i-poten.com/vue-ai-interview-app
            MFE_PUBLIC_SERVICE=https://i-poten.com
            NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
  
  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted, i-poten-front ]
    steps:
      - name: Deploy to production
        run: |
          cd /home/ec2-user/i-poten/frontend
          
          # GitHub Container Registry 로그인
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u i-cygnus --password-stdin
          
          # 기존 컨테이너 중지 및 삭제
          docker stop i-poten-frontend-container || true
          docker rm i-poten-frontend-container || true
          
          # 최신 이미지 가져오기
          docker pull ghcr.io/i-cygnus/i-poten-frontend:latest
          
          # 새 컨테이너 실행
          docker run -d -p 80:80 --name i-poten-frontend-container --network ipoten-net ghcr.io/i-cygnus/i-poten-frontend:latest
          
          # 사용하지 않는 이미지 정리
          docker image prune -af