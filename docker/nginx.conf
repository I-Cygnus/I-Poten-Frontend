events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;


    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    server {
        listen 80;

        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 네이버 서치어드바이저 소유확인 파일
        location = /naver90998be02882030c195682e27b069ad9.html {
            root /usr/share/nginx/html/next-seo-app;
        }

        # SEO 파일 (sitemap, robots)
        location = /sitemap.xml {
            root /usr/share/nginx/html/next-seo-app;
            add_header Content-Type application/xml;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /robots.txt {
            root /usr/share/nginx/html/next-seo-app;
            add_header Content-Type text/plain;
            add_header Cache-Control "public, max-age=3600";
        }

        # SEO 랜딩 페이지 (Next.js SSG)
        location = /seo {
            root /usr/share/nginx/html/next-seo-app;
            try_files /seo.html /seo/index.html =404;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /event {
            root /usr/share/nginx/html/next-seo-app;
            try_files /event.html /event/index.html =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # Next.js static assets
        location /_next/ {
            root /usr/share/nginx/html/next-seo-app;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # SvelteKit SEO 정적 페이지 (exact match → 기존 SPA 라우팅에 영향 없음)
        location = /ai-interview {
            root /usr/share/nginx/html/sveltekit-review-app;
            try_files /ai-interview/index.html /ai-interview.html =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # SEO 공통 에셋 (OG 이미지, 랜딩 이미지, 파비콘)
        location = /og-image.png {
            root /usr/share/nginx/html/sveltekit-review-app;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /landing-hero.png {
            root /usr/share/nginx/html/sveltekit-review-app;
            add_header Cache-Control "public, max-age=86400";
        }

        location ~ ^/feature-[0-9]+(-sub)?\.png$ {
            root /usr/share/nginx/html/sveltekit-review-app;
            add_header Cache-Control "public, max-age=86400";
        }

        # 메인 페이지 및 기타 페이지 (React SPA)
        location / {
            root /usr/share/nginx/html/html-container;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            root /usr/share/nginx/html/html-container;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location /mypage-app/ {
            alias /usr/share/nginx/html/mypage-app/;
            index index.html;
            try_files $uri $uri/ /mypage-app/index.html;
        }

        location /navigation-bar-app/ {
            alias /usr/share/nginx/html/navigation-bar-app/;
            index index.html;
            try_files $uri $uri/ /navigation-bar-app/index.html;
        }


  #      location /svelte-review-app/ {
  #          alias /usr/share/nginx/html/svelte-review-app/;
  #          index index.html;
  #          try_files $uri $uri/ /svelte-review-app/index.html;
  #      }

        location /vue-account-app/ {
            alias /usr/share/nginx/html/vue-account-app/;
            index index.html;
            try_files $uri $uri/ /vue-account-app/index.html;
        }

        location /ptn-word-app/ {
                    alias /usr/share/nginx/html/ptn-word-app/;
                    index index.html;
                    try_files $uri $uri/ /ptn-word-app/index.html;
                }

        location /vue-ai-interview-app/ {
            alias /usr/share/nginx/html/vue-ai-interview-app/;
            index index.html;
            try_files $uri $uri/ /vue-ai-interview-app/index.html;
        }



        # [보안] 내부 Admin API 외부 차단
        location /spring/api/internal/ {
            return 403;
        }

        # [보안] Swagger UI / OpenAPI 문서 외부 차단
        location /spring/swagger-ui/ {
            return 403;
        }
        location /spring/swagger-ui.html {
            return 403;
        }
        location /spring/v3/api-docs {
            return 403;
        }

        location /spring/api/authentication/token/verification {
            if ($cookie_userToken != "") {
                return 429;
            }

            proxy_pass http://spring-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin https://i-poten.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }



        location /spring/ {
            limit_req zone=api burst=20 nodelay;

            client_max_body_size 15M;

            proxy_pass http://spring-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin https://i-poten.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }

        location /fastapi/ {
            limit_req zone=api burst=20 nodelay;

            client_max_body_size 15M;

            proxy_pass http://fastapi:33333/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            

            add_header Access-Control-Allow-Origin https://i-poten.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }







        # 특정 도메인만 허용

        location ~ \.[0-9]+\.js$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }
}
