events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;

        # -----------------------------
        # 기본 경로
        # -----------------------------
        location / {
            root /usr/share/nginx/html/html-container;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------
        # 앱별 메인 페이지
        # -----------------------------
        location /mypage-app/ {
            alias /usr/share/nginx/html/mypage-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /mypage-app/index.html;
        }

        location /navigation-bar-app/ {
            alias /usr/share/nginx/html/navigation-bar-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /navigation-bar-app/index.html;
        }

        location /vue-account-app/ {
            alias /usr/share/nginx/html/vue-account-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /vue-account-app/index.html;
        }

        location /poten-word-app/ {
            alias /usr/share/nginx/html/poten-word-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /poten-word-app/index.html;
        }

        location /vue-ai-interview-app/ {
            alias /usr/share/nginx/html/vue-ai-interview-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /vue-ai-interview-app/index.html;
        }

        # -----------------------------
        # Spring API
        # -----------------------------
        location /spring/api/authentication/token/verification {
            if ($cookie_userToken != "") {
                return 429;
            }

            proxy_pass http://spring-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin https://job-spoon.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }

        location /spring/ {
            proxy_pass http://spring-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin https://job-spoon.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }

        # -----------------------------
        # FastAPI
        # -----------------------------
        location /fastapi/ {
            proxy_pass http://fastapi:33333/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin https://job-spoon.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        }

        # -----------------------------
        # 공통 assets
        # -----------------------------
        location ~* ^/assets/.*\.[0-9a-f]{6}\.(js|css|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|eot)$ {
            root /usr/share/nginx/html/html-container;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location /assets/ {
            root /usr/share/nginx/html/html-container;
            expires -1;
            add_header Cache-Control "no-store" always;
        }

        # -----------------------------
        # 앱별 assets
        # -----------------------------
        location ~* ^/(navigation-bar-app|vue-account-app|vue-ai-interview-app|mypage-app|poten-word-app)/assets/.*\.[0-9a-f]{6}\.(js|css|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location ~ ^/(navigation-bar-app|vue-account-app|vue-ai-interview-app|mypage-app|poten-word-app)/assets/ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }

        # -----------------------------
        # remoteEntry.js 파일
        # -----------------------------
        location ~ ^/(navigation-bar-app|vue-account-app|vue-ai-interview-app|mypage-app|poten-word-app)/remoteEntry\.js$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
    }
}
