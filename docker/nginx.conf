events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    server {
        listen 80;
        server_name _;

        # =================================================
        # 메인 컨테이너 (root SPA)
        # =================================================
        location / {
            root /usr/share/nginx/html/html-container;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        # =================================================
        # 각 앱 메인 (SPA)
        # =================================================
        location /mypage-app/ {
            alias /usr/share/nginx/html/mypage-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        location /navigation-bar-app/ {
            alias /usr/share/nginx/html/navigation-bar-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        location /vue-account-app/ {
            alias /usr/share/nginx/html/vue-account-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        location /poten-word-app/ {
            alias /usr/share/nginx/html/poten-word-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        location /vue-ai-interview-app/ {
            alias /usr/share/nginx/html/vue-ai-interview-app/;
            index index.html;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }

        # =================================================
        # Spring Backend
        # =================================================
        location /spring/ {
            proxy_pass http://spring-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin https://job-spoon.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }

        # =================================================
        # FastAPI
        # =================================================
        location /fastapi/ {
            proxy_pass http://fastapi:33333;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin https://job-spoon.com always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }

        # =================================================
        # 🔥 모든 assets (공통 + 앱별)
        # =================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # =================================================
        # Module Federation remoteEntry.js
        # (절대 캐시 ❌)
        # =================================================
        location ~* remoteEntry\.js$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
    }
}
